<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>迎新聚餐电子请柬</title>
  <!-- 引入Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ========== 全局样式 ========== */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-snap-type: y mandatory; scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #0f0c29;
      color: #fff;
      overflow-x: hidden;
    }
    .page {
      min-height: 100vh;
      height: 100vh;
      scroll-snap-align: start;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 24px;
    }
    /* ========== 第一页：欢迎页 ========== */
    #page-welcome {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    }
    .welcome-content { text-align: center; z-index: 2; max-width: 520px; width: 100%; }
    .welcome-title {
      font-size: clamp(2.2rem, 8vw, 3.6rem);
      font-weight: 800;
      letter-spacing: 0.15em;
      text-shadow: 0 4px 30px rgba(0,0,0,0.4);
      margin-bottom: 12px;
      animation: fadeInUp 1s ease 0.2s both;
    }
    .welcome-subtitle {
      font-size: clamp(0.95rem, 3.5vw, 1.15rem);
      opacity: 0.92;
      letter-spacing: 0.2em;
      margin-bottom: 28px;
      animation: fadeInUp 1s ease 0.5s both;
    }
    .welcome-date {
      display: inline-block;
      padding: 8px 24px;
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 30px;
      font-size: 0.9rem;
      letter-spacing: 0.15em;
      backdrop-filter: blur(8px);
      background: rgba(255,255,255,0.1);
      margin-bottom: 12px;
      animation: fadeInUp 1s ease 0.7s both;
    }
    .welcome-place {
      display: inline-block;
      padding: 8px 24px;
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 30px;
      font-size: 0.9rem;
      letter-spacing: 0.15em;
      backdrop-filter: blur(8px);
      background: rgba(255,255,255,0.1);
      margin-bottom: 32px;
      animation: fadeInUp 1s ease 0.8s both;
    }
    /* 图片相册 */
    .gallery {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 32px;
      animation: fadeInUp 1s ease 0.9s both;
    }
    .gallery-item {
      width: 130px;
      height: 130px;
      border-radius: 16px;
      overflow: hidden;
      border: 3px solid rgba(255,255,255,0.4);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      transition: transform 0.4s ease;
      cursor: pointer;
    }
    .gallery-item:hover { transform: scale(1.05) translateY(-4px); }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .gallery-item.placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.15);
      font-size: 2rem;
    }
    /* 滚动提示 */
    .scroll-hint {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      animation: bounce 2s infinite;
      z-index: 2;
    }
    .scroll-hint span { display: block; font-size: 0.8rem; letter-spacing: 0.2em; opacity: 0.8; margin-bottom: 8px; }
    .scroll-hint .arrow { font-size: 1.5rem; }
    @keyframes bounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(10px); }
    }
    /* ========== 第二页：时间选择 ========== */
    #page-time {
      background: linear-gradient(160deg, #2b5876 0%, #4e4376 100%);
    }
    .section-header {
      text-align: center;
      margin-bottom: 16px;
      animation: fadeInUp 0.8s ease both;
    }
    .section-header h2 {
      font-size: clamp(1.6rem, 6vw, 2.4rem);
      font-weight: 700;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
    }
    .section-header p { opacity: 0.8; font-size: 0.95rem; letter-spacing: 0.05em; }
    /* 关键：时间选项设置最大高度，超出滚动，解决手机显示不全 */
    .time-options-wrap {
      max-height: 42vh;
      overflow-y: auto;
      width: 100%;
      max-width:420px;
      padding-right:4px;
    }
    .time-options-wrap::-webkit-scrollbar{width:4px;}
    .time-options-wrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.25);border-radius:2px;}
    .time-options {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 420px;
      width: 100%;
      z-index: 2;
    }
    .time-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 20px;
      background: rgba(255,255,255,0.08);
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }
    .time-card:hover { background: rgba(255,255,255,0.14); border-color: rgba(255,255,255,0.35); transform: translateX(4px); }
    .time-card.selected {
      background: rgba(255,255,255,0.2);
      border-color: #ffd700;
      box-shadow: 0 0 20px rgba(255,215,0,0.3);
    }
    .time-card .radio {
      width: 24px; height: 24px;
      border: 2px solid rgba(255,255,255,0.5);
      border-radius: 6px; /* 改成方形多选框样式 */
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.3s ease;
    }
    .time-card.selected .radio { border-color: #ffd700; }
    .time-card.selected .radio::after {
      content: '✓'; color:#ffd700; font-weight:bold; font-size:16px;
    }
    .time-card .info { flex: 1; }
    .time-card .info .day { font-size: 1.1rem; font-weight: 600; }
    .time-card .info .detail { font-size: 0.85rem; opacity: 0.75; margin-top: 2px; }
    .time-card .votes { font-size: 0.8rem; opacity: 0.7; text-align: right; white-space: nowrap; }
    .submit-btn {
      margin-top: 18px;
      padding: 14px 48px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(135deg, #ffd700, #ffb347);
      color: #1a1a2e;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(255,215,0,0.4);
    }
    .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(255,215,0,0.55); }
    .submit-btn:active { transform: translateY(0); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .toast {
      position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-100px);
      background: rgba(255,255,255,0.95); color: #2b5876;
      padding: 12px 28px; border-radius: 30px; font-weight: 600; font-size: 0.95rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      transition: transform 0.4s ease; z-index: 100;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    /* ========== 第三页：留言填写页（仅表单） ========== */
    #page-blessing {
      background: linear-gradient(170deg, #42275a 0%, #734b6d 50%, #2c3e50 100%);
    }
    .blessing-form {
      max-width: 460px; width: 100%; z-index: 2;
      display: flex; flex-direction: column; gap: 12px;
    }
    .blessing-form input, .blessing-form textarea {
      width: 100%;
      padding: 14px 18px;
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 14px;
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 0.95rem;
      font-family: inherit;
      backdrop-filter: blur(8px);
      transition: all 0.3s ease;
    }
    .blessing-form input::placeholder, .blessing-form textarea::placeholder { color: rgba(255,255,255,0.5); }
    .blessing-form input:focus, .blessing-form textarea:focus {
      outline: none; border-color: #ffd700; background: rgba(255,255,255,0.12);
    }
    .blessing-form textarea { min-height: 80px; resize: vertical; }
    .msg-count-bar{
      max-width:460px;
      width:100%;
      padding:10px 18px;
      background:rgba(255,255,255,0.08);
      border-radius:30px;
      backdrop-filter: blur(8px);
      text-align:center;
      font-size:0.9rem;
      margin-bottom:14px;
    }
    .msg-count-bar strong{
      color:#ffd700;
      font-size:1.1rem;
    }

    /* ==========第四页：动态飘落留言展示墙 ========== */
    #page-show-blessing{
      background: linear-gradient(170deg, #2c3e50 0%, #42275a 50%, #734b6d 100%);
    }
    .falling-card{
      position:absolute;
      width:220px;
      padding:16px 14px 14px;
      border-radius:18px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.22);
      overflow:hidden;
      z-index:2;
    }
    /* 卡片下落动画，起始Y位置由JS动态设置 */
    @keyframes fallDown{
      0%{ transform: translateY(var(--startY)) rotate(-6deg); opacity:0; }
      12%{ opacity:1; }
      85%{ opacity:1; }
      100%{ transform: translateY(110vh) rotate(6deg); opacity:0; }
    }
    .falling-card.c1 { background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%); color: #5d3a3a; }
    .falling-card.c2 { background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%); color: #2c4865; }
    .falling-card.c3 { background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%); color: #4a3a5d; }
    .falling-card.c4 { background: linear-gradient(135deg, #fdcbf1 0%, #e6dee9 100%); color: #5d3a5d; }
    .falling-card.c5 { background: linear-gradient(135deg, #fff1eb 0%, #ace0f9 100%); color: #2c4a5d; }
    .falling-card.c6 { background: linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%); color: #2c5d3a; }
    .falling-card .card-header {
      display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
    }
    .falling-card .avatar {
      width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.55);
      font-weight: 700; font-size: 0.95rem;
      flex-shrink: 0;
    }
    .falling-card .name {
      font-weight:700; font-size:0.9rem; overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    }
    .falling-card .msg {
      font-size:0.85rem; line-height:1.5; word-break:break-word;
    }
    .falling-card .time{
      font-size:0.65rem;opacity:0.6;margin-top:6px;text-align:right;
    }
    .falling-card .deco-emoji {
      position: absolute;
      bottom: 8px;
      right: 10px;
      font-size: 1.4rem;
      opacity: 0.35;
    }

    /* ========== 通用动画 ========== */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    /* 背景装饰 */
    .deco-circle {
      position: absolute; border-radius: 50%;
      background: rgba(255,255,255,0.05);
      pointer-events: none;
    }
    .deco-1 { width: 300px; height: 300px; top: -100px; left: -80px; }
    .deco-2 { width: 200px; height: 200px; bottom: -60px; right: -40px; }
    .deco-3 { width: 150px; height: 150px; top: 20%; right: 10%; background: rgba(255,215,0,0.05); }
    /* 页码指示器 增加第4个点*/
    .page-dots {
      position: fixed; right: 14px; top: 50%; transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 10px; z-index: 50;
    }
    .page-dots .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: rgba(255,255,255,0.35); cursor: pointer; transition: all 0.3s ease;
    }
    .page-dots .dot.active { background: #ffd700; height: 24px; border-radius: 4px; }
    @media (max-width: 400px) {
      .falling-card{width:180px;}
    }
  </style>
</head>
<body>
  <!-- 页码指示器 4个点 -->
  <div class="page-dots">
    <div class="dot active" onclick="document.getElementById('page-welcome').scrollIntoView()"></div>
    <div class="dot" onclick="document.getElementById('page-time').scrollIntoView()"></div>
    <div class="dot" onclick="document.getElementById('page-blessing').scrollIntoView()"></div>
    <div class="dot" onclick="document.getElementById('page-show-blessing').scrollIntoView()"></div>
  </div>
  <!-- 提示弹窗 -->
  <div class="toast" id="toast"></div>

  <!-- ============ 第一页：欢迎页 ============ -->
  <section class="page" id="page-welcome">
    <div class="deco-circle deco-1"></div>
    <div class="deco-circle deco-2"></div>
    <div class="deco-circle deco-3"></div>
    <div class="welcome-content">
      <h1 class="welcome-title">迎新聚餐</h1>
      <p class="welcome-subtitle">致 2026 级新同学</p>
      <div class="welcome-date">期待与你相聚</div>
      <div class="welcome-place">📍就餐地点：佬肥猫（交大闵行校区旁）</div>
      <div class="gallery" id="gallery"></div>
      <p style="opacity:0.75; font-size:0.85rem; line-height:1.8;">
        亲爱的学弟学妹，<br />欢迎加入上海交大的大家庭！<br />让我们在聚餐中相识相知，共启新程
      </p>
    </div>
    <div class="scroll-hint">
      <span>下滑查看更多</span>
      <div class="arrow">↓</div>
    </div>
  </section>

  <!-- ============ 第二页：时间选择 ============ -->
  <section class="page" id="page-time">
    <div class="deco-circle deco-1"></div>
    <div class="deco-circle deco-2"></div>
    <div class="section-header">
      <h2>选择聚餐时间</h2>
      <p>可多选，勾选你方便的时间段，我们将根据多数人意愿确定最终时间</p>
    </div>
    <div class="time-options-wrap">
      <div class="time-options" id="timeOptions">
      </div>
    </div>
    <button class="submit-btn" id="submitTimeBtn" disabled>确认选择</button>
  </section>

  <!-- ============第三页：留言填写页 ============ -->
  <section class="page" id="page-blessing">
    <div class="deco-circle deco-1"></div>
    <div class="deco-circle deco-3"></div>
    <div class="section-header">
      <h2>留下你的留言</h2>
      <p>写下对大学生活的期待与心里话或对新生的祝愿</p>
    </div>
    <div class="msg-count-bar">
      共 <strong id="msgTotalCount">0</strong> 条同学留言
    </div>
    <div class="blessing-form">
      <input type="text" id="blessingName" placeholder="你的名字 / 昵称" maxlength="20" />
      <textarea id="blessingMsg" placeholder="写下你的留言..." maxlength="200"></textarea>
      <button class="submit-btn" id="submitBlessingBtn" style="align-self:center;">提交留言</button>
    </div>
    <div class="scroll-hint">
      <span>下滑进入留言展示墙</span>
      <div class="arrow">↓</div>
    </div>
  </section>

  <!-- ============第四页：留言飘落展示墙 ============ -->
  <section class="page" id="page-show-blessing">
    <div class="deco-circle deco-1"></div>
    <div class="deco-circle deco-2"></div>
    <div class="section-header" style="z-index:3">
      <h2>✨ 留言飘落墙</h2>
      <p>来自同学们的心里话缓缓落下</p>
    </div>
    <div id="fallingContainer" style="position:absolute;inset:0;overflow:hidden;"></div>
  </section>

<script>
/* ========== Supabase配置区 ========== */
const SUPABASE_URL = "https://hiqnhmizasffzgfhpspd.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_FWVCooHb_ZYUviDtoTn6lg_zguUAsqM";
const { createClient } = supabase;
const sbClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const WELCOME_IMAGES = [
  "https://cdn.jsdelivr.net/gh/yukicamellia/welcome-feast@main/door.jpg",
  "https://cdn.jsdelivr.net/gh/yukicamellia/welcome-feast@main/sakura.jpg",
  "https://cdn.jsdelivr.net/gh/yukicamellia/welcome-feast@main/students.jpg"
];
const TIME_OPTIONS = [
  { day: '9月13日 周日', detail: '11:30 - 14:00' },
  { day: '9月13日 周日', detail: '18:00 - 20:30' },
  { day: '9月25日 周五（中秋）', detail: '11:30 - 14:00' },
  { day: '9月25日 周五（中秋）', detail: '18:00 - 20:30' },
  { day: '9月26日 周六', detail: '11:30 - 14:00' },
  { day: '9月26日 周六', detail: '18:00 - 20:30' },
  { day: '9月27日 周日', detail: '11:30 - 14:00' },
  { day: '9月27日 周日', detail: '18:00 - 20:30' },
  { day: '10月1日（国庆） 周四', detail: '11:30 - 14:00' },
  { day: '10月1日（国庆）周四', detail: '18:00 - 20:30' },
  { day: '10月7日 周三（国庆结束）', detail: '11:30 - 14:00' },
  { day: '10月7日 周三（国庆结束）', detail: '18:00 - 20:30' },
];
let selectedTimes = [];

const BLESSING_EMOJIS = ['🌟','🎉','✨','🌸','🎈','💫','🌻','🍀','🎊','🌈'];
function getAvatarChar(name) {
  const trimmed = name.trim();
  if (!trimmed) return '匿';
  return trimmed.charAt(0).toUpperCase();
}

// 更新第三页留言总数
async function refreshMsgCount(){
  const {count,error}=await sbClient.from("blessings").select('*',{count:'exact',head:true});
  if(!error){
    document.getElementById('msgTotalCount').innerText = count;
  }
}

// 统计时间段人数
async function loadTimeVoteCount(){
  const {data,error}=await sbClient.from("dinner_signups").select("selected_times");
  if(error){
    console.error("读取报名统计失败",error);
    return;
  }
  const countArr=new Array(TIME_OPTIONS.length).fill(0);
  data.forEach(item=>{
    const userSelList=item.selected_times;
    TIME_OPTIONS.forEach((opt,idx)=>{
      const targetText=`${opt.day} ${opt.detail}`;
      if(userSelList.includes(targetText)){
        countArr[idx]++;
      }
    })
  })
  document.querySelectorAll(".time-card").forEach(card=>{
    const i=Number(card.dataset.index);
    card.querySelector(".votes").innerText=`${countArr[i]}人`;
  })
}

function renderGallery() {
  const gallery = document.getElementById('gallery');
  if (WELCOME_IMAGES.length > 0) {
    gallery.innerHTML = WELCOME_IMAGES.map(src =>
      `<div class="gallery-item"><img src="${src}" alt="照片" onerror="this.parentElement.classList.add('placeholder');this.style.display='none';this.parentElement.textContent='🌸';"></div>`
    ).join('');
  }
}
function renderTimeOptions() {
  const container = document.getElementById('timeOptions');
  container.innerHTML = TIME_OPTIONS.map((opt, i) => {
    const isSel = selectedTimes.includes(i);
    return `
      <div class="time-card ${isSel?'selected':''}" data-index="${i}" onclick="toggleTime(${i})">
        <div class="radio"></div>
        <div class="info">
          <div class="day">${opt.day}</div>
          <div class="detail">${opt.detail}</div>
        </div>
        <div class="votes">--</div>
      </div>`;
  }).join('');
  document.getElementById('submitTimeBtn').disabled = selectedTimes.length === 0;
}
function toggleTime(index) {
  const pos = selectedTimes.indexOf(index);
  if(pos >= 0){
    selectedTimes.splice(pos,1);
  }else{
    selectedTimes.push(index);
  }
  renderTimeOptions();
}

// 提交时间段报名
document.getElementById('submitTimeBtn').addEventListener('click', async () => {
  if (selectedTimes.length === 0) return;
  const userName = prompt("请输入你的姓名/昵称：");
  if(!userName || userName.trim() === ""){
    showToast("请填写昵称");
    return;
  }
  const selectTextArr = selectedTimes.map(idx=>{
    const o = TIME_OPTIONS[idx];
    return `${o.day} ${o.detail}`;
  });
  const {error} = await sbClient.from("dinner_signups").insert([{
    nickname: userName.trim(),
    selected_times: selectTextArr
  }]);
  if(error){
    console.error("报名提交错误", error);
    showToast("提交失败："+error.message);
  }else{
    showToast("✅报名已提交云端！");
    selectedTimes = [];
    renderTimeOptions();
    await loadTimeVoteCount();
  }
});

// 提交留言，提交成功刷新留言总数
document.getElementById('submitBlessingBtn').addEventListener('click', async () => {
  const name = document.getElementById('blessingName').value.trim();
  const msg = document.getElementById('blessingMsg').value.trim();
  if (!name) { showToast('请先填写你的名字'); return; }
  if (!msg) { showToast('请写下你的留言'); return; }
  const {error} = await sbClient.from('blessings').insert([{
    nickname: name,
    content: msg
  }]);
  if(error){
    console.error("留言提交错误",error);
    showToast("留言提交失败："+error.message);
  }else{
    showToast('✅留言已提交！下滑进入留言展示墙查看');
    document.getElementById('blessingName').value = '';
    document.getElementById('blessingMsg').value = '';
    await refreshMsgCount();
  }
});

// 获取全部留言，按【最新在前】顺序
async function fetchAllBlessingData(){
  const {data,error}=await sbClient.from('blessings').select("*").order('created_at',{ascending:false});
  if(error) return [];
  return data || [];
}

// 飘落墙状态变量
let fallTimer = null;
let blessingPool = [];
let playIndex = 0;
const fallContainer = document.getElementById("fallingContainer");

// 启动飘落：滑入页面立刻弹出第一张，之后间隔播放
async function runBlessingFallShow(){
  blessingPool = await fetchAllBlessingData();
  playIndex = 0;
  if(blessingPool.length ===0) return;
  if(fallTimer) clearInterval(fallTimer);

  // 立刻生成第一张卡片，不用等待定时器间隔
  if(fallContainer.querySelectorAll(".falling-card").length <6){
    const item = blessingPool[playIndex];
    createFallingCard(item);
    playIndex++;
    if(playIndex >= blessingPool.length) playIndex = 0;
  }

  fallTimer = setInterval(()=>{
    if(fallContainer.querySelectorAll(".falling-card").length >=6) return;
    const item = blessingPool[playIndex];
    createFallingCard(item);
    playIndex++;
    if(playIndex >= blessingPool.length) playIndex = 0;
  },1100);
}

// 生成单张下落卡片：随机纵向起始位置 + 随机emoji +头像处理函数
function createFallingCard(b){
  const colorClass = 'c' + ((Math.random()*6)|0 +1);
  const timeStr = new Date(b.created_at).toLocaleString();
  const randomEmoji = BLESSING_EMOJIS[Math.floor(Math.random() * BLESSING_EMOJIS.length)];
  const div = document.createElement("div");
  div.className = `falling-card ${colorClass}`;
  const maxLeft = window.innerWidth - 240;
  const randomLeft = Math.random()*maxLeft;
  const randomStartY = - (350 + Math.random() * 230);
  div.style.left = `${randomLeft}px`;
  div.style.setProperty('--startY', `${randomStartY}px`);
  div.style.animation = "fallDown 7.2s linear forwards";
  div.innerHTML = `
      <div class="card-header">
        <div class="avatar">${escapeHtml(getAvatarChar(b.nickname))}</div>
        <div class="name">${escapeHtml(b.nickname)}</div>
      </div>
      <div class="msg">${escapeHtml(b.content)}</div>
      <div class="time">${timeStr}</div>
      <div class="deco-emoji">${randomEmoji}</div>
  `;
  fallContainer.appendChild(div);
  setTimeout(()=>{div.remove();},7200);
}

// 停止飘落动画
function stopBlessingFallShow(){
  if(fallTimer){
    clearInterval(fallTimer);
    fallTimer = null;
  }
  fallContainer.innerHTML = "";
  playIndex = 0;
}

function showToast(text) {
  const toast = document.getElementById('toast');
  toast.textContent = text;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2400);
}
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

const pages = ['page-welcome', 'page-time', 'page-blessing','page-show-blessing'];
const dots = document.querySelectorAll('.page-dots .dot');
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      const idx = pages.indexOf(entry.target.id);
      dots.forEach((d, i) => d.classList.toggle('active', i === idx));
      if(idx === 3){
        runBlessingFallShow();
      }else{
        stopBlessingFallShow();
      }
    }
  });
}, { threshold: 0.4 });

pages.forEach(id => observer.observe(document.getElementById(id)));

(async function init(){
  renderGallery();
  renderTimeOptions();
  await loadTimeVoteCount();
  await refreshMsgCount();
})();
</script>
